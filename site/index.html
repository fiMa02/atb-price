<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PriceTrail — історія цін</title>
  <meta name="description" content="PriceTrail — трекер цін у супермаркетах: пошук товарів, графік зміни ціни й перевірка акцій.">
  <meta name="theme-color" content="#f5f6fa">
  <script>
    // Тема: 'light' / 'dark' — вибір користувача, інакше як у системі. Ставимо до першого малювання.
    (function () {
      var dark = matchMedia('(prefers-color-scheme: dark)');
      window.applyTheme = function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        var on = t === 'dark' || (t !== 'light' && dark.matches);
        document.documentElement.dataset.theme = on ? 'dark' : 'light';
        document.querySelector('meta[name=theme-color]').content = on ? '#0c0f14' : '#f5f6fa';
      };
      applyTheme();
      dark.addEventListener('change', applyTheme);
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top__row">
      <a href="#/" class="logo"><img src="icon.svg" alt="" width="32" height="32"><span>Price<b>Trail</b></span></a>
      <div class="top__actions">
        <div class="city-pick">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/></svg>
          <select id="city" aria-label="Місто"></select>
          <button type="button" class="city-btn" id="cityBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="cityMenu"><span id="cityName"></span><svg class="city-btn__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="city-menu" id="cityMenu" hidden>
            <input type="search" id="cityQ" placeholder="Знайти місто" autocomplete="off" aria-label="Знайти місто" aria-controls="cityList">
            <div class="city-list" id="cityList" role="listbox" aria-label="Місто"></div>
          </div>
        </div>
        <button type="button" class="fav-link theme-btn" id="themeBtn"></button>
        <a href="#/fav" class="fav-link" id="favLink" aria-label="Обране"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.6-4.7-9.4-9.6C1.4 7.6 3.6 4.5 7 4.5c2 0 3.5 1.1 5 3 1.5-1.9 3-3 5-3 3.4 0 5.6 3.1 4.4 6.4-1.8 4.9-9.4 9.6-9.4 9.6Z"/></svg><span class="fav-link__n" id="favN" hidden></span></a>
      </div>
    </div>
    <div class="wrap filters" id="filters">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="Знайти товар або бренд" autocomplete="off" aria-label="Пошук товару">
      </label>
      <div class="filters__row">
        <select id="cat" class="pill" aria-label="Категорія"><option value="">Усі категорії</option></select>
        <select id="sort" class="pill" aria-label="Сортування">
          <option value="name">За назвою</option>
          <option value="price-asc">Спершу дешевші</option>
          <option value="price-desc">Спершу дорожчі</option>
          <option value="per-kg">Дешевші за 1 кг</option>
          <option value="per-l">Дешевші за 1 л</option>
          <option value="per-pcs">Дешевші за 1 шт</option>
          <option value="discount">Найбільша знижка</option>
          <option value="changed">Нещодавно змінені</option>
        </select>
        <label class="chip-toggle"><input type="checkbox" id="sale"><span>% Акції</span></label>
        <label class="chip-toggle chip-toggle--card"><input type="checkbox" id="card"><span>💳 З карткою АТБ</span></label>
        <label class="chip-toggle chip-toggle--warn" title="Акції, де «ціна до знижки» вища, ніж товар коштував перед акцією"><input type="checkbox" id="inflated"><span>⚠ Завищені акції</span></label>
      </div>
    </div>
  </header>

  <main class="wrap" id="app"></main>

  <footer class="wrap foot">
    <p id="updated"></p>
    <p>Неофіційний проєкт, не пов'язаний з АТБ-Маркет. Ціни зібрано з atbmarket.com для одного магазину в кожному місті; в інших магазинах можуть відрізнятися.</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
