name: Збір цін і публікація

on:
  schedule:
    - cron: '30 4 * * *' # щодня о 07:30 за Києвом (04:30 UTC)
  workflow_dispatch: # ручний запуск з вкладки Actions
  push:
    branches: [main]
    paths: ['site/**', '!site/data/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Зібрати ціни
        if: github.event_name != 'push'
        run: npm run scrape

      - name: Закомітити дані
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Ціни за $(TZ=Europe/Kyiv date +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
